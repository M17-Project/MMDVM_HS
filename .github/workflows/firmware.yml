# Builds the firmware for every board in boards.json on each push. A tag
# of the firmware's version (version.h) with -m17 publishes the images,
# firmware.json (the manifest Pi-Star upgrades from) and SHA256SUMS as a
# GitHub release: vX.Y.Z-m17[.<n>] is a release, vX.Y.Z-m17[.<n>].<label>.<n>
# (.test.1, .beta.1) a pre-release. See scripts/release_build.sh.
name: Firmware

on:
  push:
    branches: [master, pistar]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    steps:
      - name: Install the toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            make git jq binutils bsdextrautils ca-certificates
          arm-none-eabi-gcc --version | head -1

      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build every board
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/release_build.sh dist "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          desc=$(jq -r '.boards[0].description | sub(" GitID.*"; "")' firmware.json)
          gitid=$(jq -r .gitid firmware.json)
          if [ "$(jq -r .prerelease firmware.json)" = true ]; then
            kind=(--prerelease)
          else
            kind=(--latest)
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" "${kind[@]}" \
            --notes "MMDVM_HS firmware with M17 packet mode for every board in configs/, built from ${gitid} (${desc#*-}).

          Each board reports \`GitID #${gitid}\` in its version string. firmware.json maps every board (by its Pi-Star id, from boards.json) to its image, with what it reports, TCXO, duplex, host link, flash method and SHA-256; SHA256SUMS covers the images and the manifest." \
            -- *.bin firmware.json SHA256SUMS
